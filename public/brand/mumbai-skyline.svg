<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Mumbai skyline silhouette: Bandra-Worli Sea Link, high-rises, Rajabai Clock Tower, Taj Mahal Palace, Gateway of India, towers -->
<g fill="#808080">
  <!-- Sea Link deck and pylons -->
  <rect x="0" y="262" width="250" height="6"/>
  <path d="M60 268 L74 150 L80 150 L72 268Z M96 268 L86 150 L80 150 L88 268Z"/>
  <path d="M170 268 L182 170 L188 170 L178 268Z M202 268 L192 170 L188 170 L196 268Z"/>
  <!-- low shoreline -->
  <rect x="0" y="300" width="1200" height="20"/>
  <!-- high-rise cluster -->
  <rect x="250" y="150" width="34" height="170"/>
  <rect x="290" y="110" width="28" height="210"/>
  <path d="M290 110 L304 92 L318 110Z"/>
  <rect x="324" y="176" width="40" height="144"/>
  <rect x="370" y="138" width="24" height="182"/>
  <!-- Rajabai Clock Tower -->
  <rect x="408" y="150" width="26" height="170"/>
  <rect x="404" y="140" width="34" height="12"/>
  <rect x="410" y="104" width="22" height="38"/>
  <circle cx="421" cy="122" r="7" fill="#fff" fill-opacity=".001"/>
  <path d="M410 104 L421 56 L432 104Z"/>
  <rect x="434" y="240" width="40" height="80"/>
  <!-- Taj Mahal Palace -->
  <rect x="480" y="218" width="190" height="102"/>
  <path d="M540 218 C540 176 610 176 610 218Z"/>
  <rect x="571" y="168" width="8" height="12"/>
  <path d="M480 218 C480 196 504 196 504 218Z M646 218 C646 196 670 196 670 218Z"/>
  <rect x="488" y="192" width="8" height="8"/><rect x="654" y="192" width="8" height="8"/>
  <!-- Gateway of India -->
  <path d="M690 320 V236 H708 V214 H716 V236 H760 V214 H768 V236 H786 V320 H760 V280 C760 262 716 262 716 280 V320Z"/>
  <path d="M704 214 C704 202 720 202 720 214Z M756 214 C756 202 772 202 772 214Z"/>
  <rect x="700" y="228" width="76" height="6"/>
  <!-- towers to the right -->
  <rect x="800" y="186" width="36" height="134"/>
  <rect x="842" y="96" width="30" height="224"/>
  <rect x="852" y="80" width="10" height="18"/>
  <rect x="878" y="150" width="44" height="170"/>
  <path d="M878 150 H922 V140 H878Z"/>
  <rect x="928" y="200" width="34" height="120"/>
  <rect x="968" y="128" width="26" height="192"/>
  <path d="M968 128 L981 112 L994 128Z"/>
  <rect x="1000" y="228" width="60" height="92"/>
  <rect x="1066" y="170" width="30" height="150"/>
  <rect x="1102" y="214" width="46" height="106"/>
  <rect x="1154" y="250" width="46" height="70"/>
</g>
<!-- Sea Link cables -->
<g stroke="#808080" stroke-width="1.5">
  <path d="M80 152 L20 262 M80 152 L40 262 M80 152 L120 262 M80 152 L140 262 M188 172 L150 262 M188 172 L134 262 M188 172 L226 262 M188 172 L244 262"/>
</g>
</svg>
